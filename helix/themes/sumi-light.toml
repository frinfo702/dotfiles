# sumi-light — pure white canvas, black ink, and two faint accent hues.
# Light counterpart to sumi. Syntax stays monochrome; a deeper ice blue and
# rose appear only where they earn it. Inherits the same syntax roles from
# sumi and only flips the palette for contrast against white surfaces.
inherits = "sumi"

[palette]
# Pure white stage
background = "#ffffff"
surface = "#fafafa"
elevated_surface = "#f2f2f2"
element_hover = "#f5f5f5"
element_selected = "#e8f0f7"
active_line = "#fafafa"
highlighted_line = "#eef4f9"
selection = "#cfe3f2"
border = "#e0e0e0"
focused_border = "#4a7ba6"

# Black ink and neutral text
text = "#1a1a1a"
text_bright = "#000000"
text_muted = "#6b6b6b"
text_disabled = "#9f9f9f"
editor_foreground = "#1a1a1a"
icon_muted = "#8a8a8a"
line_number = "#b0b0b0"
active_line_number = "#3a5a6e"
invisible = "#e0e0e0"
wrap_guide = "#dddddd"
indent_guide = "#e8e8e8"
predictive = "#8a8a8a"
syntax_soft = "#3a3a3a"
syntax_punctuation = "#6b6b6b"
cursor = "#1a1a1a"

# The two faint accents, deepened for white contrast
accent = "#4a7ba6"
ice = "#4a7ba6"
rose = "#a05a7a"

# Functional colors, kept quiet
red = "#c03030"
green = "#3f7d3f"
orange = "#a06a1f"
blue = "#3f7ba6"
purple = "#7a5fa8"
cyan = "#3f7ba6"
pink = "#a05a7a"
comment = "#909090"
comment_doc = "#7a7a7a"

diagnostic_error = "#c03030"
diagnostic_warning = "#a06a1f"
diagnostic_info = "#3f7ba6"
diagnostic_hint = "#6b6b6b"

search_match = "#ffe9a8"
# cursor-light — Helix port of Cursor IDE's Cursor Light.
# Same syntax roles as cursor-dark, retuned for the off-white canvas.
inherits = "cursor-dark"

[palette]
background = "#fcfcfc"
surface = "#f3f3f3"
elevated_surface = "#ffffff"
element_hover = "#ededed"
element_selected = "#e4e4e4"
active_line = "#ededed"
highlighted_line = "#e8eef1"
selection = "#d8d8d8"
border = "#e6e6e6"
focused_border = "#3c7cab"

text = "#141414"
text_bright = "#000000"
text_muted = "#6f6f6f"
text_disabled = "#9a9a9a"
editor_foreground = "#141414"
icon_muted = "#8a8a8a"
line_number = "#b0b0b0"
active_line_number = "#141414"
invisible = "#d0d0d0"
wrap_guide = "#e8e8e8"
indent_guide = "#ececec"
predictive = "#8a8a8a"

accent = "#3c7cab"
keyword = "#b3003f"
orange = "#db704b"
yellow = "#a16900"
blue = "#206595"
purple = "#6049b3"
string = "#9e94d5"
green = "#1f8a65"
green_soft = "#1f8a65"
cyan = "#6f9ba6"
rose = "#b8448b"
red = "#cf2d56"
comment = "#6f6f6f"
cursor = "#141414"

diagnostic_error = "#cf2d56"
diagnostic_warning = "#db704b"
diagnostic_info = "#3c7cab"
diagnostic_hint = "#1f8a65"

search_match = "#d5e4e8"

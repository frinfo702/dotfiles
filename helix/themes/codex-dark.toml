# codex-dark — Helix port of the matching Zed theme.
# Keep the near-black vercel-tint UI and replace its syntax palette.
inherits = "vercel-tint"

# Syntax
"attribute" = "codex_foreground"
"type" = "codex_foreground"
"type.builtin" = "codex_foreground"
"type.enum.variant" = "codex_foreground"
"constructor" = "codex_function"
"constant" = "codex_literal"
"constant.builtin" = "codex_literal"
"constant.builtin.boolean" = "codex_literal"
"constant.character" = "codex_literal"
"constant.character.escape" = "codex_function"
"constant.numeric" = "codex_literal"
"string" = "codex_literal"
"string.regexp" = "codex_literal"
"string.special" = "codex_function"
"string.special.path" = "codex_literal"
"string.special.url" = "codex_keyword"
"string.special.symbol" = "codex_function"
"comment" = "codex_comment"
"comment.line" = "codex_comment"
"comment.block" = "codex_comment"
"comment.documentation" = "codex_comment"
"variable" = "codex_foreground"
"variable.builtin" = "codex_foreground"
"variable.parameter" = "codex_foreground"
"variable.other" = "codex_foreground"
"variable.other.member" = "codex_foreground"
"label" = "codex_keyword"
"keyword" = "codex_keyword"
"keyword.control" = "codex_keyword"
"keyword.control.conditional" = "codex_keyword"
"keyword.control.repeat" = "codex_keyword"
"keyword.control.import" = "codex_keyword"
"keyword.control.return" = "codex_keyword"
"keyword.control.exception" = "codex_keyword"
"keyword.directive" = "codex_keyword"
"keyword.function" = "codex_keyword"
"keyword.operator" = "codex_operator"
"operator" = "codex_operator"
"function" = "codex_function"
"function.builtin" = "codex_function"
"function.macro" = "codex_function"
"function.method" = "codex_function"
"tag" = "codex_keyword"
"tag.attribute" = "codex_foreground"
"namespace" = "codex_foreground"
"module" = "codex_foreground"
"special" = "codex_function"
"punctuation" = "codex_operator"
"punctuation.bracket" = "codex_operator"
"punctuation.delimiter" = "codex_operator"
"punctuation.special" = "codex_function"

# Markup
"markup.heading" = { fg = "codex_foreground", modifiers = ["bold"] }
"markup.heading.marker" = "codex_keyword"
"markup.bold" = { fg = "codex_foreground", modifiers = ["bold"] }
"markup.italic" = { fg = "codex_foreground", modifiers = ["italic"] }
"markup.link.url" = { fg = "codex_keyword", modifiers = ["underlined"] }
"markup.link.text" = "codex_function"
"markup.link.label" = "codex_function"
"markup.raw" = "codex_literal"
"markup.raw.block" = "codex_literal"
"markup.list" = "codex_keyword"
"markup.quote" = "codex_comment"

[palette]
codex_foreground = "#e7e9ef"
codex_keyword = "#8e97f8"
codex_function = "#bda2f9"
codex_literal = "#c2b9a6"
codex_operator = "#b7bcca"
codex_comment = "#86878b"

# https://github.com/nametake/golangci-lint-langserver
# [language-server.golangci-lint]
# command = "golangci-lint-langserver"
# config = { command = [
#   "golangci-lint",
#   "run",
#   "--enable-all",
#   "--disable",
#   "lll",
#   "--out-format",
#   "json",
#   "--issues-exit-code=1"
# ] }
# --------
[[language]]
name = "toml"
auto-format = true
# https://github.com/bd82/toml-tools/tree/master/packages/prettier-plugin-toml
formatter = { command = "prettier", args = ["--parser", "toml"] }

[[language]]
name = "json"
formatter = { command = "prettier", args = ["--parser", "json"] }

[[language]]
name = "markdown"
# https://github.com/executablebooks/mdformat
formatter = { command = "mdformat", args = ["-"] }

[[language]]
name = "rust"

[[language]]
name = "go"
auto-format = true
formatter = { command = "gofmt", args = [] }
language-servers = ["gopls", "golangci-lint"]

[[language]]
name = "yaml"
formatter = { command = "prettier", args = ["--parser", "yaml"] }

################################
# Dockerfile / Docker Compose
################################
[[language]]
name = "dockerfile"
auto-format = true
# LSP: docker-langserver (npm i -g dockerfile-language-server-nodejs)
# Formatter: via LSP (docker-langserver)

[[language]]
name = "docker-compose"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "yaml"] }
# LSP: docker-compose-langserver (npm i -g @microsoft/compose-language-service)

################################
# TypeScript / JavaScript
################################
# Default: PATH `tsc --lsp` (TypeScript 7+) and PATH `biome`.
# Per-project override: <repo>/.helix/languages.toml (merged on top of this file).
# Example:
#   [language-server.tsc]
#   command = "./node_modules/.bin/tsc"
#   args = ["--lsp", "--stdio"]
#   [language-server.biome]
#   command = "./node_modules/.bin/biome"
#   args = ["lsp-proxy"]
# TypeScript 6 and older cannot speak --lsp; point `command` at
# typescript-language-server instead.

[language-server.tsc]
command = "tsc"
args = ["--lsp", "--stdio"]

[language-server.tsc.config.typescript]
format.enabled = false
inlayHints.enumMemberValues.enabled = true
inlayHints.functionLikeReturnTypes.enabled = true
inlayHints.parameterTypes.enabled = true
inlayHints.parameterNames.enabled = "all"
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.variableTypes.enabled = true

[language-server.tsc.config.javascript]
format.enabled = false
inlayHints.enumMemberValues.enabled = true
inlayHints.functionLikeReturnTypes.enabled = true
inlayHints.parameterTypes.enabled = true
inlayHints.parameterNames.enabled = "all"
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.variableTypes.enabled = true

[language-server.biome]
command = "biome"
args = ["lsp-proxy"]

[[language]]
name = "typescript"
auto-format = true
roots = ["biome.json", "biome.jsonc", "tsconfig.json", "package.json"]
language-servers = [
  { name = "tsc", except-features = ["format"] },
  "biome",
]

[[language]]
name = "tsx"
auto-format = true
roots = ["biome.json", "biome.jsonc", "tsconfig.json", "package.json"]
language-servers = [
  { name = "tsc", except-features = ["format"] },
  "biome",
]

[[language]]
name = "javascript"
auto-format = true
roots = ["biome.json", "biome.jsonc", "jsconfig.json", "package.json"]
language-servers = [
  { name = "tsc", except-features = ["format"] },
  "biome",
]

[[language]]
name = "jsx"
auto-format = true
roots = ["biome.json", "biome.jsonc", "jsconfig.json", "package.json"]
language-servers = [
  { name = "tsc", except-features = ["format"] },
  "biome",
]

################################
# MongoDB playgrounds
################################
# Official MongoDB LSP lives inside the VS Code extension and is not a
# standalone server. Playgrounds are JS (mongosh API), so reuse tsc + biome
# with the javascript grammar. Run queries with mongosh, not an LSP.
# Files: *.mongodb.js (current) and *.mongodb (legacy playgrounds).
[[language]]
name = "mongodb"
scope = "source.mongodb"
injection-regex = "mongodb"
language-id = "javascript"
grammar = "javascript"
file-types = [
  { glob = "*.mongodb.js" },
  { glob = "*.mongodb" },
]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
roots = ["biome.json", "biome.jsonc", "package.json"]
indent = { tab-width = 2, unit = "  " }
auto-format = true
language-servers = [
  { name = "tsc", except-features = ["format"] },
  "biome",
]

################################
# C / C++
################################
[[language]]
name = "c"
auto-format = true
formatter = { command = "clang-format", args = ["--style=file", "--assume-filename={buffer_path}"] }

[[language]]
name = "cpp"
auto-format = true
formatter = { command = "clang-format", args = ["--style=file", "--assume-filename={buffer_path}"] }

################################
# Lua
################################
[[language]]
name = "lua"
auto-format = true
formatter = { command = "stylua", args = ["--search-parent-directories", "--stdin-filepath", "{buffer_path}", "-"] }

################################
# Shell
################################
[[language]]
name = "bash"
auto-format = true
formatter = { command = "shfmt", args = ["-i", "2", "-ci", "-"] }

################################
# Terraform / HCL
################################
[[language]]
name = "hcl"
auto-format = true
formatter = { command = "terraform", args = ["fmt", "-"] }

################################
# HTML / CSS
################################
[[language]]
name = "html"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "html"] }

[[language]]
name = "css"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "css"] }

################################
# Typst
################################
[[language]]
name = "typst"
auto-format = true
# LSP: tinymist (brew install tinymist)
# Formatter: via tinymist LSP


[[language]]
name = "scala"
indent = { tab-width = 2, unit = "  " }

[language-server.metals]
command = "metals"
# metals v2 Java indexer uses JDK internal APIs, so --add-exports is required
args = [
  "-J--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
  "-J--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
  "-J--add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED",
  "-J--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
  "-J--add-exports=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED",
  "-J--add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",
  "-J--add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED",
  "-J--add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED",
  "-J--add-exports=jdk.compiler/com.sun.tools.javac.platform=ALL-UNNAMED",
  "-J--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
  "-J--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED",
]

# Increase Bloop (build server) heap; default can OOM on large repos
[language-server.metals.config.metals]
bloopJvmProperties = ["-Xmx6G", "-Xss4m", "-XX:+UseZGC", "-XX:ZUncommitDelay=30", "-XX:ZCollectionInterval=5"]


#########################
# python
#########################
[[language]]
name = "python"
auto-format = true
formatter = { command = "ruff", args = ["format", "--stdin-filename", "{buffer_path}"] }
# pyright: completions / hover / goto-def
# ruff: diagnostics (and format via external formatter above)
language-servers = ["pyright", "ruff"]

[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.pyright.config]
python.analysis.venvPath = "."
python.analysis.venv = ".venv"
python.analysis.lint = true
python.analysis.inlayHint.enable = true
python.analysis.autoSearchPaths = true
python.analysis.diagnosticMode = "workspace"
python.analysis.useLibraryCodeForTypes = true
python.analysis.logLevel = "Error"
python.analysis.typeCheckingMode = "off"
python.analysis.autoImportCompletions = true
python.analysis.reportOptionalSubscript = false
python.analysis.reportOptionalMemberAccess = false

[language-server.ruff]
command = "ruff"
args = ["server", "-q", "--preview"]
